spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
by-iara.media.storage-root=${java.io.tmpdir}/by-iara-tests/${random.uuid}

# JavaMailSender is a @MockitoBean in tests; the real health check expects a
# JavaMailSenderImpl bean specifically and fails context startup without one.
management.health.mail.enabled=false
