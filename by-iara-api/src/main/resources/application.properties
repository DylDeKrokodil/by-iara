spring.application.name=by-iara-api
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
by-iara.media.storage-root=${MEDIA_STORAGE_ROOT:./data/media}
by-iara.media.provider=${MEDIA_STORAGE_PROVIDER:filesystem}
by-iara.media.s3.endpoint=${MEDIA_S3_ENDPOINT:}
by-iara.media.s3.region=${MEDIA_S3_REGION:eu-central}
by-iara.media.s3.bucket=${MEDIA_S3_BUCKET:}
by-iara.media.s3.access-key=${MEDIA_S3_ACCESS_KEY:}
by-iara.media.s3.secret-key=${MEDIA_S3_SECRET_KEY:}
by-iara.media.s3.path-style-access=${MEDIA_S3_PATH_STYLE_ACCESS:false}
by-iara.media.s3.key-prefix=${MEDIA_S3_KEY_PREFIX:}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/by_iara}
spring.datasource.username=${DATABASE_USERNAME:by_iara}
spring.datasource.password=${DATABASE_PASSWORD:by_iara}
spring.flyway.enabled=true

by-iara.auth.token-ttl-seconds=${ADMIN_TOKEN_TTL_SECONDS:3600}
by-iara.auth.refresh-token-ttl-seconds=${ADMIN_REFRESH_TOKEN_TTL_SECONDS:1209600}
by-iara.auth.jwt-issuer=${ADMIN_JWT_ISSUER:by-iara-api}
by-iara.auth.jwt-secret=${ADMIN_JWT_SECRET:local-development-secret-must-be-at-least-32-bytes}
by-iara.auth.refresh-cookie-secure=${ADMIN_REFRESH_COOKIE_SECURE:false}
by-iara.auth.login-window-seconds=${ADMIN_LOGIN_WINDOW_SECONDS:900}
by-iara.auth.login-pair-max-failures=${ADMIN_LOGIN_PAIR_MAX_FAILURES:5}
by-iara.auth.login-ip-max-failures=${ADMIN_LOGIN_IP_MAX_FAILURES:20}
by-iara.auth.initial-admin.enabled=${INITIAL_ADMIN_ENABLED:false}
by-iara.auth.initial-admin.email=${INITIAL_ADMIN_EMAIL:}
by-iara.auth.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}

# Defaults match Mailpit (see docker-compose.yml) so local dev needs zero mail config.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:10000}
by-iara.notifications.from-address=${NOTIFICATIONS_FROM_ADDRESS:noreply@by-iara.local}

# TODO(legal-launch): Set the public business telephone number before launch. It is
# included in confirmation emails so health concerns can be discussed by telephone.
by-iara.business-phone=${BUSINESS_PHONE:}
# Customer-facing appointment location used in confirmation emails, map links,
# and calendar attachments. Keep it complete enough for map search/geocoding.
by-iara.business-address=${BUSINESS_ADDRESS:Rua Vila do Seixal 5, 1.\u00ba direito, 2810-141 Almada, Portugal}
by-iara.business-email=${BUSINESS_EMAIL:info@iaragouveia.com}

# Base URL of the admin app (no trailing slash), used to deep-link from the new-reservation
# alert email straight to the reservation. Default matches the local admin dev port.
by-iara.admin-url=${ADMIN_URL:http://localhost:4201}
by-iara.website-url=${WEBSITE_URL:http://localhost:4300}
# Direct Google Business review URL used after an appointment is completed. Leave
# blank until the business-specific review link is configured; the thank-you email
# is still sent, but without a review button.
by-iara.google-review-url=${GOOGLE_REVIEW_URL:https://g.page/r/CVzKM_-9IuRxEAE/review}
by-iara.customer-access.magic-link-ttl-minutes=${CUSTOMER_MAGIC_LINK_TTL_MINUTES:20}
by-iara.customer-access.session-ttl-days=${CUSTOMER_SESSION_TTL_DAYS:30}
by-iara.public-rate-limit.window-seconds=${PUBLIC_RATE_LIMIT_WINDOW_SECONDS:60}
by-iara.public-rate-limit.booking-email-max-requests=${BOOKING_EMAIL_MAX_REQUESTS:5}
by-iara.public-rate-limit.customer-access-email-max-requests=${CUSTOMER_ACCESS_EMAIL_MAX_REQUESTS:2}

# Rolling window of reservations included in an admin's calendar subscription feed.
by-iara.calendar-feed.past-days=${CALENDAR_FEED_PAST_DAYS:7}
by-iara.calendar-feed.future-days=${CALENDAR_FEED_FUTURE_DAYS:180}
