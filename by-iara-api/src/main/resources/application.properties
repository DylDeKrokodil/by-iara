spring.application.name=by-iara-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/by_iara}
spring.datasource.username=${DATABASE_USERNAME:by_iara}
spring.datasource.password=${DATABASE_PASSWORD:by_iara}
spring.flyway.enabled=true

by-iara.auth.token-ttl-seconds=${ADMIN_TOKEN_TTL_SECONDS:3600}
by-iara.auth.refresh-token-ttl-seconds=${ADMIN_REFRESH_TOKEN_TTL_SECONDS:1209600}
by-iara.auth.jwt-issuer=${ADMIN_JWT_ISSUER:by-iara-api}
by-iara.auth.jwt-secret=${ADMIN_JWT_SECRET:local-development-secret-must-be-at-least-32-bytes}
by-iara.auth.initial-admin.enabled=${INITIAL_ADMIN_ENABLED:false}
by-iara.auth.initial-admin.email=${INITIAL_ADMIN_EMAIL:}
by-iara.auth.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}

# Defaults match Mailpit (see docker-compose.yml) so local dev needs zero mail config.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:10000}
by-iara.notifications.from-address=${NOTIFICATIONS_FROM_ADDRESS:noreply@by-iara.local}

# TODO(legal-launch): Set the public business telephone number before launch. It is
# included in confirmation emails so health concerns can be discussed by telephone.
by-iara.business-phone=${BUSINESS_PHONE:}

# Base URL of the admin app (no trailing slash), used to deep-link from the new-reservation
# alert email straight to the reservation. Default matches the local admin dev port.
by-iara.admin-url=${ADMIN_URL:http://localhost:4201}

# Rolling window of reservations included in an admin's calendar subscription feed.
by-iara.calendar-feed.past-days=${CALENDAR_FEED_PAST_DAYS:7}
by-iara.calendar-feed.future-days=${CALENDAR_FEED_FUTURE_DAYS:180}
