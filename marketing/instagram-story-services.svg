<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">By Iara Instagram Story — Services &amp; Prices</title>
  <desc id="desc">A vertical Instagram story for By Iara on soft blush, with the logo, a Serviços title, and four massage services each showing two duration and price options in white cards with rose line icons.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fff9fc"/>
      <stop offset="0.5" stop-color="#fff3f8"/>
      <stop offset="1" stop-color="#fce7f1"/>
    </linearGradient>
    <filter id="softCard" x="-12%" y="-30%" width="124%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#9b3b66" flood-opacity="0.10"/>
    </filter>
    <filter id="frondBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <g id="ic-lotus" fill="none" stroke="#e11d74" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <g transform="rotate(0)"><path d="M0 8 C -6 -2 -6 -13 0 -19 C 6 -13 6 -2 0 8 Z"/></g>
      <g transform="rotate(35)"><path d="M0 8 C -6 -2 -6 -13 0 -19 C 6 -13 6 -2 0 8 Z"/></g>
