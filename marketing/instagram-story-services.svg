      <path d="M-20 0 q 5 -6 10 0 t 10 0 t 10 0 t 10 0"/>
      <path d="M-20 9 q 5 -6 10 0 t 10 0 t 10 0 t 10 0"/>
    </g>

    <g id="ic-hand" fill="none" stroke="#e11d74" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-9 -5 L-9 -15"/>
      <path d="M-3 -6 L-3 -18"/>
      <path d="M3 -6 L3 -17"/>
      <path d="M9 -4 L9 -13"/>
      <path d="M-9 -5 C -10 -1 -10 3 -9 6 C -7 14 -1 17 4 16 C 10 15 13 9 12 3 C 11 -2 8 -4 6 -2 L6 -7"/>
      <path d="M-9 -1 C -15 1 -16 7 -13 13"/>
