      <path d="M-7 -18 C -13 -8 -13 4 -6 18"/>
      <path d="M7 -18 C 13 -8 13 4 6 18"/>
      <path d="M-6 18 Q 0 21 6 18"/>
      <circle cx="0" cy="2" r="1.7" fill="#e11d74" stroke="none"/>
