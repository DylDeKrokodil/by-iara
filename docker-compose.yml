services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: by_iara
      POSTGRES_USER: by_iara
      POSTGRES_PASSWORD: by_iara
    ports:
      - "5432:5432"
    volumes:
      - by_iara_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U by_iara -d by_iara"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./by-iara-api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/by_iara
      DATABASE_USERNAME: by_iara
      DATABASE_PASSWORD: by_iara
      ADMIN_TOKEN_TTL_SECONDS: 3600
      ADMIN_JWT_ISSUER: by-iara-api
      ADMIN_JWT_SECRET: local-docker-development-secret-must-be-at-least-32-bytes
      INITIAL_ADMIN_ENABLED: "true"
      INITIAL_ADMIN_EMAIL: admin@by-iara.local
      INITIAL_ADMIN_PASSWORD: ChangeMe123!
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # TODO(legal-launch): Set this before launch; confirmation emails use it for
      # the private telephone channel for health and safety concerns.
      BUSINESS_PHONE: ${BUSINESS_PHONE:-}
      BUSINESS_ADDRESS: ${BUSINESS_ADDRESS:-Rua Vila do Seixal 5, 1.º direito, 2810-141 Almada, Portugal}
      BUSINESS_EMAIL: ${BUSINESS_EMAIL:-info@iaragouveia.com}
      # A human clicks this link from their own browser, not container-to-container --
      # must be the host-published admin port, unlike MAIL_HOST above.
      ADMIN_URL: http://localhost:4201
      WEBSITE_URL: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Catches all outbound mail locally -- view sent emails at http://localhost:8025
  # instead of configuring a real SMTP account for dev. 1025 is published too so
  # `./gradlew bootRun` on the host (not just the dockerized api service) can reach it.
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  website:
    build:
      context: ./by-iara-web
      target: website
    environment:
      PORT: 4000
      NG_ALLOWED_HOSTS: ${WEB_ALLOWED_HOSTS:-localhost,127.0.0.1}
      API_PROXY_TARGET: http://api:8080
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:4200}
    ports:
      - "4200:4000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    profiles: ["web"]

  admin:
    build:
      context: ./by-iara-web
      target: admin
    ports:
      - "4201:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    profiles: ["web"]

volumes:
  by_iara_postgres_data:
