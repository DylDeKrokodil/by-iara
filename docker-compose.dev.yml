services:
  admin:
    build:
      context: ./by-iara-web
      dockerfile: Dockerfile.dev
    environment:
      ADMIN_API_PROXY_TARGET: http://api:8080
      CHOKIDAR_USEPOLLING: true
      NX_DAEMON: false
      WATCHPACK_POLLING: true
    command: pnpm nx serve admin --host=0.0.0.0 --port=80 --poll=1000
    volumes:
      - ./by-iara-web:/workspace
      - by_iara_web_node_modules:/workspace/node_modules
      - by_iara_web_angular_cache:/workspace/.angular
      - by_iara_web_nx_cache:/workspace/.nx
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    profiles: ["web"]

volumes:
  by_iara_web_node_modules:
  by_iara_web_angular_cache:
  by_iara_web_nx_cache:
