name: CI

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-only:
    name: release-only
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require the release branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: test "$HEAD_REF" = "release"

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: by-iara-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: by-iara-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t lint test build --projects=theme,website,admin
        env:
          NX_DAEMON: "false"

  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: by-iara-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x ./gradlew && ./gradlew test --no-daemon

  deploy-release:
    name: deploy-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: [web, api]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/release_deploy
          chmod 600 ~/.ssh/release_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy the tested release commit
        env:
          DEPLOY_HOST: ${{ vars.HETZNER_HOST }}
          DEPLOY_USER: ${{ vars.HETZNER_DEPLOY_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          ssh \
            -i ~/.ssh/release_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$DEPLOY_SHA"
