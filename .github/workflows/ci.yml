name: CI

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-only:
    name: release-only
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require the release branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: test "$HEAD_REF" = "release"

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: by-iara-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: by-iara-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t lint test build --projects=theme,website,admin
        env:
          NX_DAEMON: 'false'

  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: by-iara-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x ./gradlew && ./gradlew test --no-daemon
