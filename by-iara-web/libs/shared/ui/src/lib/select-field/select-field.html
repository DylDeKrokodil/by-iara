<div class="select-field">
  <span class="select-label" [id]="labelId">{{ label() }}</span>
  <div class="select-control">
    <button
      type="button"
      class="select-trigger"
      [class.open]="open()"
      [attr.aria-labelledby]="labelId"
      [attr.aria-controls]="listboxId"
      [attr.aria-expanded]="open()"
      [attr.aria-activedescendant]="activeOptionId()"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="error() ? errorId : null"
      aria-haspopup="listbox"
      (click)="toggleDropdown()"
      (blur)="touched.emit()"
      (keydown)="onTriggerKeydown($event)"
    >
      <span>{{ selectedLabel() }}</span>
    </button>

    @if (open()) {
    <div
      class="select-menu"
      role="listbox"
      [id]="listboxId"
      [attr.aria-labelledby]="labelId"
    >
      @for (option of options(); track option.value; let optionIndex = $index) {
      <button
        type="button"
        class="select-option"
        role="option"
        [id]="optionId(optionIndex)"
        [class.active]="activeIndex() === optionIndex"
        [class.selected]="option.value === value()"
        [attr.aria-selected]="option.value === value()"
        (click)="selectOption(option)"
        (mouseenter)="activateOption(optionIndex)"
      >
        {{ option.label }}
      </button>
      }
    </div>
    }
  </div>
  @if (error()) {
  <span class="select-error" [id]="errorId" aria-live="polite"
    >{{ error() }}</span
  >
  }
</div>
