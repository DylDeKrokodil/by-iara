<dialog #dialog closedby="any" (cancel)="close()" class="confirmation-dialog">
  <div class="dialog-content">
    <h3 class="dialog-title">{{ title() }}</h3>
    <p class="dialog-message">{{ message() }}</p>

    <div class="dialog-actions">
      <byiara-button type="button" variant="secondary" (click)="close()">
        {{ cancelText() }}
      </byiara-button>
      <byiara-button type="button" [variant]="variant()" (click)="onConfirm()">
        {{ confirmText() }}
      </byiara-button>
    </div>
  </div>
</dialog>
