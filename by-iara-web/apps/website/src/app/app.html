<div class="site-frame">
  <header class="site-header">
    <div class="header-container">
      <a class="logo-link" [routerLink]="language.localizedLink()">
        <span class="logo-text">By Iara</span>
      </a>
      <div class="header-actions">
        <nav class="header-nav">
          <a
            [routerLink]="language.localizedLink()"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            {{ copy().nav.home }}
          </a>
          <a [routerLink]="language.localizedLink('services')" routerLinkActive="active">
            {{ copy().nav.services }}
          </a>
        </nav>
        <byiara-language-switcher></byiara-language-switcher>
      </div>
    </div>
  </header>

  <main class="site-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p class="footer-text">{{ copy().footer }}</p>
    </div>
  </footer>
</div>

<byiara-toast-container></byiara-toast-container>
