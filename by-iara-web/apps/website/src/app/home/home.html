<main class="home" aria-labelledby="home-title">
  <section class="home-stage">
    <div class="home-copy">
      <p class="home-location">{{ copy().location }}</p>
      <h1 id="home-title">{{ copy().title }}</h1>
      <p class="home-lede">{{ copy().lede }}</p>
      <div class="home-actions" [attr.aria-label]="copy().actionsLabel">
        <byiara-button
          class="home-action"
          variant="primary"
          [routerLink]="language.localizedLink('book')"
        >
          {{ copy().primaryAction }}
        </byiara-button>
        <byiara-button
          class="home-action"
          variant="secondary"
          [routerLink]="language.localizedLink('services')"
        >
          {{ copy().secondaryAction }}
        </byiara-button>
      </div>
    </div>

    <div class="home-mark" aria-hidden="true">
      <div class="home-mark-rose"></div>
      <div class="home-mark-plum"></div>
      <div class="home-mark-lime"></div>
      <img src="brand/by-iara-monogram.svg" alt="" />
    </div>
  </section>
</main>
