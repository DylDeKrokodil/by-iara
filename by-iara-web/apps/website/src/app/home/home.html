<main class="home" aria-labelledby="home-title">
  <section class="home-stage">
    <div class="home-copy">
      <p class="home-location">{{ copy().location }}</p>
      <h1 id="home-title">{{ copy().title }}</h1>
      <p class="home-lede">{{ copy().lede }}</p>
      <div class="home-actions" [attr.aria-label]="copy().actionsLabel">
        <byiara-button
          class="home-action"
          variant="primary"
          [routerLink]="language.localizedLink('book')"
        >
          {{ copy().primaryAction }}
        </byiara-button>
        <byiara-button
          class="home-action"
          variant="secondary"
          [routerLink]="language.localizedLink('services')"
        >
          {{ copy().secondaryAction }}
        </byiara-button>
      </div>
    </div>

    <div class="home-visual-column">
      <div class="home-visual">
        <img
          class="home-photo"
          src="hero/hero-massage.jpg"
          width="1400"
          height="933"
          alt=""
        />
        <byiara-next-available-badge></byiara-next-available-badge>
      </div>

      <p class="home-photo-credit">
        <a
          href="https://commons.wikimedia.org/wiki/File:Massage_at_Witches_Falls_Cottages.jpg"
          target="_blank"
          rel="noopener"
        >
          {{ copy().photoCredit }}
        </a>
      </p>
    </div>
  </section>
</main>
