<svg xmlns="http://www.w3.org/2000/svg" width="1179" height="570" viewBox="0 0 1179.291284 569.922890" role="img" aria-labelledby="t d">
<title id="t">By Iara logo</title>
<desc id="d">By Iara monogram — a b whose bowl cradles a resting figure, a dotted j, and the by iara wordmark, in brand rose.</desc>
<style>
  .intro-structure, .intro-wordmark, .intro-figure-head,
  .intro-figure-face, .intro-figure-body { transform-box: fill-box; }
  .intro-structure {
    opacity: .12; transform: scale(.965); transform-origin: center;
    animation: structure-form 340ms cubic-bezier(.22,1,.36,1) 380ms forwards;
  }
  .intro-wordmark {
    opacity: 0; transform: translateX(-70px);
    animation: wordmark-arrive 300ms cubic-bezier(.22,1,.36,1) 650ms forwards;
  }
  .intro-figure-head {
    opacity: 0; transform: translate(34px,-42px) rotate(7deg); transform-origin: 22% 58%;
    animation: head-settle 560ms cubic-bezier(.22,1,.36,1) 60ms forwards;
  }
  .intro-figure-face {
    opacity: 0; transform: translate(24px,-24px) scale(.86); transform-origin: center;
    animation: face-settle 500ms cubic-bezier(.22,1,.36,1) 140ms forwards;
  }
  .intro-figure-body {
    opacity: 0; transform: translateX(90px) scaleX(.72); transform-origin: right center;
    animation: body-stretch 600ms cubic-bezier(.22,1,.36,1) 80ms forwards;
  }
  @keyframes structure-form { to { opacity: 1; transform: scale(1); } }
  @keyframes wordmark-arrive { to { opacity: 1; transform: translateX(0); } }
  @keyframes head-settle {
    0% { opacity: 0; transform: translate(34px,-42px) rotate(7deg); }
    16% { opacity: 1; transform: translate(34px,-42px) rotate(7deg); }
    62% { opacity: 1; transform: translate(-7px,10px) rotate(-2deg); }
    100% { opacity: 1; transform: translate(0) rotate(0); }
  }
  @keyframes face-settle {
    0% { opacity: 0; transform: translate(24px,-24px) scale(.86); }
    22% { opacity: 1; transform: translate(0) scale(1); }
    64% { opacity: 1; transform: translate(0) scale(1); }
    72% { opacity: 1; transform: translate(0) scale(1,.08); }
    82%, 100% { opacity: 1; transform: translate(0) scale(1); }
  }
  @keyframes body-stretch {
    0% { opacity: 0; transform: translateX(90px) scaleX(.72); }
    16% { opacity: 1; transform: translateX(90px) scaleX(.72); }
    68% { opacity: 1; transform: translateX(-12px) scaleX(1.035); }
    100% { opacity: 1; transform: translateX(0) scaleX(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .intro-structure, .intro-wordmark, .intro-figure-head,
    .intro-figure-face, .intro-figure-body {
      animation: none; opacity: 1; transform: none;
    }
  }
</style>
