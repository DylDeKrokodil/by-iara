<div class="page-header">
  <div>
    <p class="eyebrow">Catalogue</p>
    <h1>{{ editing ? 'Edit service' : 'New service' }}</h1>
  </div>
  <a class="button-secondary" routerLink="/services">Back to services</a>
</div>

@if (error()) {
  <p class="alert" role="alert">{{ error() }}</p>
}

<form class="service-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <label class="field">
    <span>Name</span>
    <input type="text" formControlName="name" placeholder="Deep tissue massage" />
  </label>

  <label class="field">
    <span>Description</span>
    <textarea formControlName="description" rows="3" placeholder="Optional"></textarea>
  </label>

  <label class="checkbox">
    <input type="checkbox" formControlName="active" />
    <span>Active (visible in the public catalogue)</span>
  </label>

  <fieldset class="variants" formArrayName="variants">
    <legend>Durations &amp; pricing</legend>

    @for (variant of variants.controls; track $index) {
      <div class="variant-row" [formGroupName]="$index">
        <label class="field">
          <span>Minutes</span>
          <input type="number" formControlName="durationMinutes" min="1" />
        </label>
        <label class="field">
          <span>Price (€)</span>
          <input type="number" formControlName="priceEuros" min="0" step="0.01" />
        </label>
        <label class="checkbox">
          <input type="checkbox" formControlName="active" />
          <span>Active</span>
        </label>
        <button
          type="button"
          class="button-ghost"
          [disabled]="variants.length === 1"
          (click)="removeVariant($index)"
        >
          Remove
        </button>
      </div>
    }

    <button type="button" class="button-secondary" (click)="addVariant()">
      Add duration
    </button>
  </fieldset>

  <div class="form-actions">
    <button type="submit" class="button-primary" [disabled]="submitting()">
      {{ submitting() ? 'Saving…' : 'Save service' }}
    </button>
    <a class="button-secondary" routerLink="/services">Cancel</a>
  </div>
</form>
