<byiara-page-header admin label="Catalogue" title="Services">
  <byiara-button
    page-header-action
    variant="primary"
    routerLink="/services/new"
  >
    New service
  </byiara-button>
</byiara-page-header>

@if (error()) {
<byiara-alert tone="danger">{{ error() }}</byiara-alert>
}

<div class="list-toolbar" aria-label="Service list filters">
  <byiara-text-field
    class="search-filter"
    label="Search services"
    type="search"
    autocomplete="off"
    [formControl]="searchControl"
  ></byiara-text-field>
  <byiara-select-field
    label="Status"
    [options]="statusFilters"
    [value]="selectedStatus()"
    (valueChange)="onStatusFilterChange($event)"
  >
  </byiara-select-field>
</div>

@if (!loading() && services().length === 0) {
<byiara-empty-state
  [title]="hasFilters() ? 'No services match your filters.' : 'No services yet.'"
>
  @if (hasFilters()) {
  <byiara-button variant="secondary" (click)="clearFilters()">
    Clear filters
  </byiara-button>
  } @else {
  <byiara-button variant="primary" routerLink="/services/new">
    Create your first service
  </byiara-button>
  }
</byiara-empty-state>
} @else {
<byiara-data-table
  ariaLabel="Services"
  [columns]="serviceTableColumns"
  [rows]="services()"
  [loading]="loading()"
  [skeletonRows]="4"
  [sortKey]="sortKey()"
  [sortDirection]="sortDirection() === 'ASC' ? 'asc' : 'desc'"
  (sortChange)="onSortChange($event)"
>
  <ng-template #rowTemplate let-service>
    <tr [class.inactive]="!service.active">
      <td>
        <div class="name-cell">
          <span class="service-name">{{ service.name }}</span>
          <span class="slug">/{{ service.slug }}</span>
        </div>
      </td>
      <td>
        <span class="metric-value">{{ durationSummary(service) }}</span>
      </td>
      <td>
        <span class="metric-value">{{ priceSummary(service) }}</span>
      </td>
      <td>
        <span class="metric-value">{{ service.sortOrder }}</span>
      </td>
      <td>
        <byiara-status-chip [active]="service.active"></byiara-status-chip>
      </td>
      <td class="actions-col">
        <byiara-action-menu
          [items]="actionsFor(service)"
          [ariaLabel]="'Actions for ' + service.name"
          (actionSelected)="handleAction(service, $event)"
        ></byiara-action-menu>
      </td>
    </tr>
  </ng-template>
</byiara-data-table>
}

<byiara-confirmation-modal
  #confirmDeactivateModal
  title="Deactivate Service"
  [message]="serviceToDeactivate() ? 'Are you sure you want to deactivate the service &ldquo;' + serviceToDeactivate()?.name + '&rdquo;? It will be hidden from the public catalogue.' : ''"
  confirmText="Deactivate"
  cancelText="Cancel"
  variant="primary"
  (confirmed)="onConfirmDeactivate()"
  (cancelled)="onCancelDeactivate()"
>
</byiara-confirmation-modal>
