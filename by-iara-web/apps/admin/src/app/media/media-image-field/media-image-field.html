<div class="media-field">
  <div class="media-field-heading">
    <strong>{{ label() }}</strong>
    <span>{{ metaLabel() }}</span>
  </div>

  @if (helperText()) {
  <p class="helper-text" [id]="helperId()">{{ helperText() }}</p>
  } @if (imageUrl(); as url) {
  <div class="image-preview">
    <img [src]="url" [alt]="imageAlt()" />
  </div>
  } @else {
  <div class="image-placeholder">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect width="18" height="18" x="3" y="3" rx="2" />
      <circle cx="9" cy="9" r="2" />
      <path d="m21 15-5-5L5 21" />
    </svg>
    <span>No image selected</span>
  </div>
  }

  <div class="image-actions" [class.has-remove]="imageUrl()">
    <byiara-button
      variant="secondary"
      [disabled]="disabled()"
      (click)="libraryRequested.emit()"
    >
      <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="18" height="18" x="3" y="3" rx="2" />
        <circle cx="9" cy="9" r="2" />
        <path d="m21 15-5-5L5 21" />
      </svg>
      Library
    </byiara-button>

    <label class="file-picker" [class.is-disabled]="disabled()">
      <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m18 8-6-6-6 6" />
        <path d="M12 2v14" />
        <path d="M5 13v7h14v-7" />
      </svg>
      <span>Upload</span>
      <input
        [id]="inputId()"
        type="file"
        accept="image/jpeg,image/png"
        [disabled]="disabled()"
        [attr.aria-describedby]="describedBy()"
        (change)="fileSelected.emit($event)"
      />
    </label>

    @if (imageUrl()) {
    <byiara-button
      variant="ghost"
      iconOnly
      [disabled]="disabled()"
      [ariaLabel]="'Remove ' + label().toLowerCase()"
      (click)="removeRequested.emit()"
    >
      <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 6h18" />
        <path d="M8 6V4h8v2" />
        <path d="M19 6l-1 14H6L5 6" />
        <path d="M10 11v5M14 11v5" />
      </svg>
    </byiara-button>
    }
  </div>

  @if (processing()) {
  <p class="image-status" role="status">Optimizing image…</p>
  } @if (error()) {
  <p class="error-message" [id]="errorId()" role="alert">{{ error() }}</p>
  }
</div>
