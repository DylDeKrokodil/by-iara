<main class="login-shell">
  <div class="login-brand">
    <img src="brand/iara-gouveia-lockup-v3.svg" alt="Iara Gouveia" /><span
      >Practice manager</span
    >
  </div>
  <div class="login-card-wrap">
    <div class="login-symbol" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <rect x="5" y="10" width="14" height="11" rx="3" />
        <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3" />
      </svg>
    </div>
    <h1>Welcome back.</h1>
    <p class="subtitle">
      Your practice, in one place.<br />Sign in to take care of the day ahead.
    </p>
    <form
      class="login-form"
      [formGroup]="form"
      (ngSubmit)="submit()"
      novalidate
    >
      @if (error()) { <byiara-alert tone="danger">{{ error() }}</byiara-alert> }
      <byiara-text-field
        label="Email"
        type="email"
        formControlName="email"
        autocomplete="username"
        required
        [error]="touchedError(form.controls.email, { required: 'Enter your email address.', email: 'Enter a valid email address.' })"
      />
      <byiara-text-field
        label="Password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        required
        [error]="touchedError(form.controls.password, { required: 'Enter your password.' })"
      />
      <byiara-button type="submit" [loading]="submitting()"
        >{{ submitting() ? 'Signing in…' : 'Sign in' }}</byiara-button
      >
    </form>
  </div>
  <p class="login-footer">Iara Gouveia · Administration</p>
</main>
