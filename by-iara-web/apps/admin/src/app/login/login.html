<main class="login-shell">
  <div class="login-card-wrap">
    <byiara-card padding="lg">
      <form class="login-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <p class="brand">Iara Gouveia</p>
        <h1>Admin sign in</h1>
        <p class="subtitle">Sign in to manage reservations and availability.</p>

        @if (error()) {
          <byiara-alert tone="danger">{{ error() }}</byiara-alert>
        }

        <byiara-text-field
          label="Email"
          type="email"
          formControlName="email"
          autocomplete="username"
        ></byiara-text-field>

        <byiara-text-field
          label="Password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        ></byiara-text-field>

        <byiara-button type="submit" [loading]="submitting()">
          {{ submitting() ? 'Signing in…' : 'Sign in' }}
        </byiara-button>
      </form>
    </byiara-card>
  </div>
</main>
