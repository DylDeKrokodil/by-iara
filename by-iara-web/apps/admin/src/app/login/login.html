<main class="login-shell">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <p class="brand">By Iara</p>
    <h1>Admin sign in</h1>
    <p class="subtitle">Sign in to manage reservations and availability.</p>

    @if (error()) {
      <p class="alert" role="alert">{{ error() }}</p>
    }

    <label class="field">
      <span>Email</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="username"
        placeholder="admin@by-iara.local"
      />
    </label>

    <label class="field">
      <span>Password</span>
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        placeholder="••••••••"
      />
    </label>

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</main>
