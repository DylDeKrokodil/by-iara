name: by-iara-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/hetzner/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      website:
        condition: service_healthy
      admin:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - edge
    mem_limit: 256m
    cpus: 0.50
    logging: *default-logging

  website:
    build:
      context: ./by-iara-web
      target: website
    restart: unless-stopped
    init: true
    environment:
      PORT: 4000
      NG_ALLOWED_HOSTS: ${DOMAIN},www.${DOMAIN}
      NG_TRUST_PROXY_HEADERS: x-forwarded-for,x-forwarded-host,x-forwarded-proto
      API_PROXY_TARGET: http://api:8080
      PUBLIC_SITE_URL: https://${DOMAIN}
      NODE_OPTIONS: --max-old-space-size=512
    expose:
      - "4000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - edge
    mem_limit: 768m
    cpus: 0.75
    logging: *default-logging

  admin:
    build:
      context: ./by-iara-web
      target: admin
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edge
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging

  api:
    build:
      context: ./by-iara-api
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-by_iara}
      DATABASE_USERNAME: ${POSTGRES_USER:-by_iara}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      ADMIN_TOKEN_TTL_SECONDS: ${ADMIN_TOKEN_TTL_SECONDS:-3600}
      ADMIN_REFRESH_TOKEN_TTL_SECONDS: ${ADMIN_REFRESH_TOKEN_TTL_SECONDS:-1209600}
      ADMIN_JWT_ISSUER: ${ADMIN_JWT_ISSUER:-by-iara-api}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET in .env.production}
      ADMIN_LOGIN_WINDOW_SECONDS: ${ADMIN_LOGIN_WINDOW_SECONDS:-900}
      ADMIN_LOGIN_PAIR_MAX_FAILURES: ${ADMIN_LOGIN_PAIR_MAX_FAILURES:-5}
      ADMIN_LOGIN_IP_MAX_FAILURES: ${ADMIN_LOGIN_IP_MAX_FAILURES:-20}
      INITIAL_ADMIN_ENABLED: ${INITIAL_ADMIN_ENABLED:-false}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST in .env.production}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-true}
      MAIL_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED:-true}
      NOTIFICATIONS_FROM_ADDRESS: ${NOTIFICATIONS_FROM_ADDRESS:?Set NOTIFICATIONS_FROM_ADDRESS in .env.production}
      BUSINESS_PHONE: ${BUSINESS_PHONE:?Set BUSINESS_PHONE in .env.production}
      ADMIN_URL: https://admin.${DOMAIN}
      WEBSITE_URL: https://${DOMAIN}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - edge
      - database
    mem_limit: 1536m
    cpus: 1.50
    logging: *default-logging

  postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-by_iara}
      POSTGRES_USER: ${POSTGRES_USER:-by_iara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_connections=50
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - database
    mem_limit: 1536m
    cpus: 1.00
    logging: *default-logging

  postgres-backup:
    build:
      context: ./deploy/hetzner/postgres-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-by_iara}
      PGUSER: ${POSTGRES_USER:-by_iara}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
    mem_limit: 256m
    cpus: 0.25
    logging: *default-logging

networks:
  edge:
  database:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
